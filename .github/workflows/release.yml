name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same checks as every push: tests, UI tests on both VS Code versions, audit.
  test:
    uses: ./.github/workflows/ci.yml

  # Single gated job that does BOTH the GitHub Release and the marketplace /
  # OpenVSX publish. Runs only on a manual workflow_dispatch (never on a tag
  # push — a tag push runs `test` and stops). It references the
  # required-reviewer `marketplace` environment, so the whole run pauses for
  # approval before anything is built or published.
  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    environment: marketplace
    permissions:
      contents: write # create the GitHub Release

    steps:
      - name: Assert dispatched from a v* tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *) echo "Must dispatch from a v* tag, got ${GITHUB_REF}"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # This job holds the publishing tokens: no dependency cache, which another
          # workflow run could have written.
          package-manager-cache: false

      - name: Assert tag matches package.json version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce@4.1.0 ovsx@1.3.0

      # Build the VSIX once, in this job, and use the SAME file for the GitHub
      # Release and both publishes — no cross-job artifact hand-off, so what's
      # on the Release is byte-identical to what ships to the marketplace.
      - name: Build VSIX
        run: vsce package

      - name: Read changelog entry
        id: changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: CHANGELOG.md
          # This release's own entry, not whichever is newest (e.g. an "Unreleased" section).
          version: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: '*.vsix'
          body: ${{ steps.changelog.outputs.changes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        run: vsce publish --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: ovsx publish ./*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
