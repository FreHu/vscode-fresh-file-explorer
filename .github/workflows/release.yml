name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Gate the release toolchain on new critical advisories. All current
      # vulns are devDependencies (build host / CI only, no runtime egress);
      # the residual highs are non-applicable transitive dev tooling with no
      # clean forward fix (serialize-javascript via mocha; esbuild's dev-server
      # advisory, and we only use esbuild as a CLI bundler). Gating at
      # `critical` blocks a genuinely new critical from shipping unflagged
      # without going perpetually red on the accepted dev-only set.
      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Run tests
        run: xvfb-run -a npm test

  # Single gated job that does BOTH the GitHub Release and the marketplace /
  # OpenVSX publish. Runs only on a manual workflow_dispatch (never on a tag
  # push — a tag push runs `test` and stops). It references the
  # required-reviewer `marketplace` environment, so the whole run pauses for
  # approval before anything is built or published.
  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    environment: marketplace
    permissions:
      contents: write # create the GitHub Release

    steps:
      - name: Assert dispatched from a v* tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *) echo "Must dispatch from a v* tag, got ${GITHUB_REF}"; exit 1 ;;
          esac

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Assert tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce ovsx

      # Build the VSIX once, in this job, and use the SAME file for the GitHub
      # Release and both publishes — no cross-job artifact hand-off, so what's
      # on the Release is byte-identical to what ships to the marketplace.
      - name: Build VSIX
        run: vsce package

      - name: Read changelog entry
        id: changelog
        uses: mindsers/changelog-reader-action@5ca6b859dbd794b56d53077cf5969269e676ec66 # v2
        with:
          path: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: '*.vsix'
          body: ${{ steps.changelog.outputs.changes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        run: vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
